name: WatchHive Mobile - Build, Release & Google Play Deployment

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Release Android APK & App Bundle
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure .env asset file exists
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Decode & Verify Android Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            python3 -c "import os, base64; raw=os.environ['ANDROID_KEYSTORE_BASE64'].replace('\n','').replace('\r','').replace(' ','').strip(); raw+='='*(-len(raw)%4); open('android/upload-keystore.jks', 'wb').write(base64.b64decode(raw))"
            if keytool -list -keystore android/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "Android Keystore verified successfully."
            else
              echo "Keystore validation failed. Removing invalid keystore file to fallback to debug bundle."
              rm -f android/upload-keystore.jks
            fi
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided. Skipping release keystore decoding."
          fi

      - name: Decode Google Play Service Account Key
        run: |
          if [ -n "$PLAY_STORE_JSON_KEY_BASE64" ]; then
            python3 -c "import os, base64; raw=os.environ['PLAY_STORE_JSON_KEY_BASE64'].replace('\n','').replace('\r','').replace(' ','').strip(); raw+='='*(-len(raw)%4); open('android/pc-api-key.json', 'wb').write(base64.b64decode(raw))"
            echo "Google Play JSON key decoded successfully."
          else
            echo "No PLAY_STORE_JSON_KEY_BASE64 secret provided. Skipping Play Store JSON key decoding."
          fi

      - name: Build Android Release APK & App Bundle (.aab)
        env:
          KEYSTORE_FILE: "../upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "android/upload-keystore.jks" ]; then
            echo "Building Release APK and App Bundle (.aab)..."
            flutter build apk --release
            flutter build appbundle --release
          else
            echo "Building Debug APK and App Bundle (.aab)..."
            flutter build apk --debug
            flutter build appbundle --debug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchhive-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Upload App Bundle Artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: watchhive-appbundle
          path: build/app/outputs/bundle/*/*.aab
          retention-days: 14

      - name: Create GitHub Release with APK & AAB
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Google Play Store (Internal Track)
        run: |
          if [ -f "android/pc-api-key.json" ]; then
            cd android
            gem install fastlane
            fastlane internal
          else
            echo "No valid pc-api-key.json configured. Skipping Fastlane Play Store deployment."
          fi

