name: WatchHive Mobile - Google Play Store CI/CD Deployment

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Publish Android App Bundle (.aab)
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Decode Android Keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            echo "Android Keystore decoded successfully."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided. Skipping release keystore decoding."
          fi

      - name: Decode Google Play Service Account Key
        run: |
          if [ -n "$PLAY_STORE_JSON_KEY_BASE64" ]; then
            echo "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > android/pc-api-key.json
            echo "Google Play JSON key decoded successfully."
          else
            echo "No PLAY_STORE_JSON_KEY_BASE64 secret provided. Skipping Play Store JSON key decoding."
          fi

      - name: Build Android App Bundle (.aab)
        env:
          KEYSTORE_FILE: "../upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "android/upload-keystore.jks" ]; then
            echo "Building Release App Bundle (.aab)..."
            flutter build appbundle --release
          else
            echo "Building Debug App Bundle (.aab)..."
            flutter build appbundle --debug
          fi

      - name: Upload Build Artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: watchhive-appbundle
          path: build/app/outputs/bundle/*/*.aab
          retention-days: 14

      - name: Deploy to Google Play Store (Internal Track)
        run: |
          if [ -n "$PLAY_STORE_JSON_KEY_BASE64" ]; then
            cd android
            gem install fastlane
            fastlane internal
          else
            echo "No PLAY_STORE_JSON_KEY_BASE64 secret provided. Skipping Fastlane Play Store deployment."
          fi
