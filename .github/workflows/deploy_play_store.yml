name: WatchHive Mobile - Google Play Store CI/CD Deployment

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Publish Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Decode Android Keystore
        if: secrets.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Decode Google Play Service Account Key
        if: secrets.PLAY_STORE_JSON_KEY_BASE64 != ''
        env:
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
        run: |
          echo "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > android/pc-api-key.json

      - name: Build Android App Bundle (.aab)
        env:
          KEYSTORE_FILE: "../upload-keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload Build Artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: watchhive-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Setup Ruby for Fastlane
        if: secrets.PLAY_STORE_JSON_KEY_BASE64 != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: android

      - name: Install Fastlane
        if: secrets.PLAY_STORE_JSON_KEY_BASE64 != ''
        run: |
          cd android
          gem install fastlane

      - name: Deploy to Google Play Store (Internal Track)
        if: secrets.PLAY_STORE_JSON_KEY_BASE64 != ''
        run: |
          cd android
          fastlane internal
