name: WatchHive Mobile - Staging CI/CD & Build

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-staging:
    name: Build Staging Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configure Staging Environment (.env)
        run: |
          if [ -f ".env.staging" ]; then
            cp .env.staging .env
          elif [ -f ".env.staging.example" ]; then
            cp .env.staging.example .env
          else
            cp .env.example .env
          fi
          echo "Staging environment file (.env) configured."

      - name: Setup Firebase Configuration from Secrets
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            python3 -c "import os, base64; raw=os.environ['GOOGLE_SERVICES_JSON_BASE64'].strip(); open('android/app/google-services.json', 'wb').write(base64.b64decode(raw))"
            echo "google-services.json decoded successfully from secret."
          elif [ -f "android/app/google-services.json.example" ] && [ ! -f "android/app/google-services.json" ]; then
            cp android/app/google-services.json.example android/app/google-services.json
            echo "Using google-services.json.example fallback template."
          fi

          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            python3 -c "import os, base64; raw=os.environ['FIREBASE_OPTIONS_DART_BASE64'].strip(); open('lib/firebase_options.dart', 'wb').write(base64.b64decode(raw))"
            echo "firebase_options.dart decoded successfully from secret."
          elif [ -f "lib/firebase_options.dart.example" ] && [ ! -f "lib/firebase_options.dart" ]; then
            cp lib/firebase_options.dart.example lib/firebase_options.dart
            echo "Using firebase_options.dart.example fallback template."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Decode & Verify Android Keystore (if provided)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            python3 -c "import os, base64; raw=os.environ['ANDROID_KEYSTORE_BASE64'].replace('\n','').replace('\r','').replace(' ','').strip(); raw+='='*(-len(raw)%4); data=base64.b64decode(raw); open('android/upload-keystore.jks', 'wb').write(data); open('android/app/upload-keystore.jks', 'wb').write(data); open('android/key.properties', 'w').write(f'storePassword={os.environ.get(\"KEYSTORE_PASSWORD\", \"\")}\nkeyPassword={os.environ.get(\"KEY_PASSWORD\", \"\")}\nkeyAlias={os.environ.get(\"KEY_ALIAS\", \"\")}\nstoreFile=upload-keystore.jks\n')"
            if keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "Android Keystore verified successfully."
            else
              echo "Keystore validation failed. Removing invalid keystore file to use default signing."
              rm -f android/upload-keystore.jks android/app/upload-keystore.jks
            fi
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided. Skipping release keystore decoding."
          fi

      - name: Build Android Staging APK
        run: flutter build apk --release

      - name: Upload Staging APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchhive-staging-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
